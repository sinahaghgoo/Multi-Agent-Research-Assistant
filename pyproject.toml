[project]
name = "research-assistant"
version = "0.1.0"
description = "Local multi-agent research assistant: a LangGraph supervisor coordinating web research, document analysis and cited report synthesis on Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sina Haghgoo" }]
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.7,<2",
    "langchain-ollama>=1.1,<2",
    "httpx>=0.28",
    "trafilatura>=2.3",
    "lxml>=5.3",
    "pypdf>=7.0",
    "ddgs>=9.16",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.67"]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.14"]
notebook = ["nbconvert>=7.17", "nbclient>=0.10", "ipykernel>=7.0", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ollama: requires a running Ollama server with the configured models"]
addopts = "-m 'not ollama'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Notebook mirrors use per-cell imports and bare trailing expressions for display.
"notebooks/*" = ["E402", "B018"]
